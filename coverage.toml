# Coverage configuration for the shared tooling in jmerhar/coverage, which renders the CI summary
# table, enforces the gate, and publishes the HTML report to https://jmerhar.github.io/coverage/.
#
# One suite: the shell in scripts/ and bin/, traced by kcov via bin/run-coverage.sh. kcov measures lines
# only — there is no branch coverage for shell — so the table simply has no Branch column.
#
# `report` points at the merged report and `html` at the kcov output root; what gets published follows
# from that. kcov also writes one report per traced invocation, each crediting only the hits from runs
# that targeted a single script while listing every file, so each reads as wrong on its own. Only the
# merged report is published, with the data/ directory whose stylesheet its per-file pages resolve as
# ../data/bcov.css.

[suites.scripts]
label = "Shell scripts (bash)"
format = "kcov"
report = "coverage/kcov-merged/coverage.json"
html = "coverage"
# Set just under the measured figure so a real regression fails while a defensive line here or there is
# tolerated. Every publishable script has a behavioural suite, and no measured file has a `\` continuation
# left, so what remains uncovered is code the tests cannot drive rather than logic they miss:
#
#   * branches for a tool that is absent. dot_clean, flock, ionice, visudo and systemd-run are stubbed so
#     the two CI runners agree, which means each one's "command not found, skipping" path never runs;
#   * colour setup behind `[[ -t 1 ]]`, since bats is never a terminal;
#   * root-only and non-root-only branches, each unreachable on one of the two runs;
#   * guards that exist precisely because they should never fire;
#   * roughly 113 lines that are not bash at all: the interiors of multi-line `awk`, `jq` and
#     `xmllint --xpath` programs. Bash attributes the whole command to one line, so kcov counts the rest
#     as never-executed bash even though they run — as awk, jq and XPath. No test can reach them.
#
# Excluding that last category line by line was tried and rejected: kcov's --exclude-line and
# --exclude-region both drop the lines correctly, but in this build they also disable --include-path, so
# the measurement then takes in unrelated files (including previous output directories' HTML and JS) and
# the overall figure stops meaning anything. Re-test that before trying again.
#
# --exclude-pattern drops whole files rather than lines and does not have that effect, which is what
# keeps `.conf` files and the per-script READMEs out of the measurement. Both matter: kcov's bash parser
# reads an ordinary prose line as code, so a file that is not bash at all is otherwise reported as bash
# that never ran — a README beside a script cost 36 uncovered lines before it was excluded.
#
# The measured figure is 89.15% (3080/3455 lines) across 20 files.
#
# Raise it as coverage climbs; never lower it to make a red build pass, and never delete a guard to
# flatter the number.
gate = 88.0
