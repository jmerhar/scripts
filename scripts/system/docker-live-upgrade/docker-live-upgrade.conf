# Configuration for docker-live-upgrade. Every setting is optional.
#
# DAEMON_TIMEOUT — seconds to wait for the daemon to answer after the command finishes.
#DAEMON_TIMEOUT=300
#
# HEALTH_TIMEOUT — seconds a started container has to become running and, if it has a healthcheck,
# healthy, before it is reported as failed.
#HEALTH_TIMEOUT=300
#
# POLL_INTERVAL — seconds between checks while waiting.
#POLL_INTERVAL=2
#
# BATCH_SIZE — containers started together within one tier; the next batch waits for these.
#BATCH_SIZE=3
#
# Tiers set the repair order, lowest first. A container's tier is, in order of precedence:
#   1. the value of its TIER_LABEL label, when that is a positive integer;
#   2. its cgroup parent's entry in CGROUP_PARENT_TIERS, as 'name=<tier>';
#   3. DEFAULT_TIER.
# The cgroup mapping suits hosts that already group containers into systemd slices by priority, so
# the order needs no new labels. Compose depends_on is honoured regardless of tiers: a container whose
# tier is earlier than its dependency's waits for it, and each run warns about such a pair.
#TIER_LABEL=docker-live-upgrade.tier
#DEFAULT_TIER=50
#CGROUP_PARENT_TIERS=(system-critical.slice=10 system-bulk.slice=90)
#
# PRE_HOOK and POST_HOOK — command lines run with `bash -c` just before the command and after the
# repair, for instance to open and close a monitoring maintenance window. Once PRE_HOOK has run, POST_HOOK
# always runs too. A failing hook is logged and does not stop the run. POST_HOOK sees
# DOCKER_LIVE_UPGRADE_RESULT (restored, repaired, command-failed or failed) and
# DOCKER_LIVE_UPGRADE_SUMMARY (the one-line summary) in its environment.
#PRE_HOOK=""
#POST_HOOK=""
#
# LOG_FILE — where the run is logged as well as the terminal. An installed copy defaults to
# <prefix>/var/log/docker-live-upgrade.log.
#LOG_FILE=""
