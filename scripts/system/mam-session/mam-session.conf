#
# Configuration file for the mam-session script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# It holds a tracker session, which is enough to act as the account — so the
# script refuses to run unless this file is unreadable by other users:
#
#   chmod 600 /etc/mam-session.conf
#
# What goes in MAM_ID is a session created in the tracker's security settings
# with "allow session to set dynamic seedbox" enabled. It is NOT an account
# password, and an ordinary login session will not work: the endpoint refuses one
# as the wrong session type. A session can also be revoked in one click, which a
# password cannot.
MAM_ID=""

# (Optional) Where the rotated session, the last address seen and the time of the
# last call are kept. Created private to the user that runs the script. Under a
# system prefix, point this somewhere the cron user owns.
#STATE_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/mam-session"

# (Optional) Service asked for this machine's public address, used only to decide
# whether the tracker is worth calling. Set it to "" to skip the check, in which
# case the tracker is called whenever the interval below has passed and reports the
# address itself.
#IP_SERVICE="https://api.ipify.org"

# (Optional) The tracker is a private one, and needless requests to its API are the
# kind of thing accounts are suspended for. When the address cannot be checked
# cheaply, this is the floor between calls. --force overrides it.
#MIN_INTERVAL=3600

# (Optional) Seconds to wait on the network before giving up.
#TIMEOUT=20

# (Optional) Path to the log file. If commented out or empty, output goes only to
# the console — which for a cron entry means the mail it sends.
# Example: LOG_FILE="/var/log/mam-session.log"
#LOG_FILE=""
