# Configuration for memory-pressure-alert.
#
# Thresholds are deliberately generous on swap and conservative on the other two.
# Swap is the leading indicator — it sits near zero on a healthy Mac and accrues
# over days — so a low threshold buys days of warning. Used memory and the
# compressor only move once the slide is already under way, so they confirm
# rather than predict.
#
# Memory and the compressor are shares of installed RAM so that these defaults fit
# any machine: what a healthy Mac holds compressed grows with the RAM it has, so a
# fixed size in MB is deafening on a small machine and silent on a large one. Swap
# stays a size, because what makes it dangerous does not scale with RAM — a healthy
# machine of any size sits near zero, and each page written costs the same disk
# round trip whatever the total.

# Warn once this much swap is in use (MB).
SWAP_WARN_MB=2048

# Warn once this much of RAM is in use, counted as Activity Monitor and Stats count it: anonymous,
# wired and compressed pages, with the file cache excluded because the kernel reclaims it on demand.
# A healthy Mac runs high here — 70% is unremarkable — so only a high threshold means trouble.
USED_WARN_PERCENT=85

# Warn once this much of RAM is held compressed. Compressed memory is memory the kernel has squeezed
# in place instead of paging it out, since RAM is faster than disk. It is already counted in
# USED_WARN_PERCENT above, so it is not consumption on top of that figure: this threshold measures how
# hard the machine is working to stay out of swap, and a third of RAM is ordinary on a machine whose
# swap is still empty. At half of RAM there is little left to squeeze, so swap is where the next
# pressure goes.
COMPRESSOR_WARN_PERCENT=50
