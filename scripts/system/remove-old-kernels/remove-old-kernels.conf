#
# Configuration file for the remove-old-kernels script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.

# (Optional) How many recent kernels to keep besides the running one. 1 keeps the
# newest installed, which is what a machine that has updated but not yet rebooted
# needs in order to boot into it. Raise it if you want a further fallback on hand.
#KEEP_COUNT=1

# (Optional) Path to the log file. If commented out or empty, output goes only to
# the console.
# Example: LOG_FILE="/var/log/remove-old-kernels.log"
#LOG_FILE=""
