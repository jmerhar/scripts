#
# Configuration file for the smart-check script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# Every setting has a default, so the script runs without this file.

# (Optional) Warn below this much rated life left on a solid-state drive, as the
# percentage the drive's own wear attribute counts down.
#WEAR_MIN=20

# (Optional) Warn above this temperature, in Celsius. 60 leaves headroom under the
# 65 that consumer drives are typically rated to, so a warning means something is
# wrong with the airflow rather than that the disk is working.
#TEMP_MAX=60

# (Optional) Warn above this many interface CRC errors. These count link errors
# between the controller and the drive, so they usually mean a cable rather than a
# dying disk — but they never go down, so a machine with a known-good history can
# raise this to keep the report quiet about them.
#CRC_MAX=0

# (Optional) Devices to examine, as a Bash array. Left unset, smartctl is asked
# what it can find, which is what a machine wants after a disk is swapped. Naming
# them is for the case where the scan reports something that is not a disk, or
# where only some disks are yours to watch.
#DEVICES=(/dev/sda /dev/sdb)

# (Optional) Path to the log file. If commented out or empty, output goes only to
# the console.
# Example: LOG_FILE="/var/log/smart-check.log"
#LOG_FILE=""
