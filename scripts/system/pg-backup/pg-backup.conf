#
# Configuration file for the pg-backup script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.

# The directory the dumps are kept under, one subdirectory per database.
# Example: BACKUP_DIR="/mnt/storage/backup/scheduled/databases"
#BACKUP_DIR=""

# The databases to dump, one entry per line, each four fields separated by spaces:
#   NAME       subdirectory and file prefix under BACKUP_DIR (letters, digits, . _ -)
#   CONTAINER  the Docker container Postgres runs in
#   USER       the role pg_dump connects as
#   DATABASE   the database to dump
DATABASES=(
  # "joplin joplin-db joplin joplin"
)

# How many dumps each tier keeps. A daily dump is taken every run; the first dump of each ISO week and of
# each month is also kept in the weekly and monthly tiers.
KEEP_DAILY=14
KEEP_WEEKLY=4
KEEP_MONTHLY=12

# (Optional) A file the log is also written to. Unset, the log goes only to the terminal, or to the
# journal when systemd runs the script.
#LOG_FILE=""
