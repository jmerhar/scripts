#
# Configuration file for the db-backup script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.

# The directory the dumps are kept under, one subdirectory per entry.
# Example: BACKUP_DIR="/srv/backup/databases"
#BACKUP_DIR=""

# The databases to back up, one entry per line. Each starts with its engine and a NAME, which becomes the
# subdirectory and file prefix under BACKUP_DIR (letters, digits, . _ -):
#
#   postgres NAME CONTAINER USER DATABASE
#   mariadb  NAME CONTAINER DATABASE
#   mongodb  NAME CONTAINER DATABASE
#   sqlite   NAME PATH
#
# CONTAINER is the container's name as `docker ps` shows it, not a network alias. Postgres connects as
# USER over the container's local socket; MariaDB connects as root with the password in the container's
# MARIADB_ROOT_PASSWORD (or MYSQL_ROOT_PASSWORD); MongoDB connects without authentication. A SQLite PATH
# is the database file on this host, and may contain spaces; the user running the backup needs write
# access to its directory, since SQLite readers of a WAL database write its -shm file.
DATABASES=(
  # "postgres app   app-postgres app app"
  # "mariadb  books books-mariadb books"
  # "mongodb  media media-mongo media"
  # "sqlite   wiki  /srv/wiki/data/wiki.db"
)

# How many dumps each tier keeps. A daily dump is taken every run; the first dump of each ISO week and of
# each month is also kept in the weekly and monthly tiers.
KEEP_DAILY=14
KEEP_WEEKLY=4
KEEP_MONTHLY=12

# (Optional) A file the log is also written to. Unset, the log goes only to the terminal, or to the
# journal when systemd runs the script.
#LOG_FILE=""
