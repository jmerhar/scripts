#
# Configuration file for the build-ffmpeg-nonfree script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# Every setting has a default, so the script runs without this file. Pinning the
# component tags here is what makes a build reproducible; leaving them unset is
# what keeps it current.

# (Optional) Where the built binaries are installed. Defaults to the bin directory
# of the prefix this script is installed under, so a packaged copy installs beside
# itself. It must precede /usr/bin on PATH for the build to have any effect.
#DEST="/usr/local/bin"

# (Optional) CPUs the container may use. x265 dominates the build and will take
# every core it is given, so this exists to leave a machine usable while it runs.
#CPU_LIMIT="2"

# (Optional) Where the per-run log goes. An unwritable directory is a warning and a
# fall back to $HOME, never a reason for the build not to start.
#LOG_DIR="/var/log/build-ffmpeg-nonfree"

# (Optional) Pinned component versions. Unset means "the latest stable release",
# discovered from each project at run time. Set them to reproduce a known-good
# build — the script prints the exact command to do so at the start of every run.
#BASE_IMAGE="ubuntu:24.04"
#FFMPEG_TAG="n7.1"
#X264_REF="stable"
#X265_TAG="4.1"
#FDKAAC_TAG="v2.0.3"
#OPUS_TAG="v1.5.2"

# (Optional) Versions with no upstream tag to discover: lame has cut no release
# since 3.100, and the nasm pin is only used when the container base's nasm is too
# old to assemble current ffmpeg assembly.
#LAME_VERSION="3.100"
#NASM_VERSION="2.16.03"
