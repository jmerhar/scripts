#
# Configuration file for the modernize-video script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# Every setting has a default, so the script runs without this file.

# (Optional) Quality, as an x264 CRF: lower is better and larger. 18 is visually
# transparent, and worth keeping for footage that cannot be re-shot. A compact
# camera recorded MJPEG at a bitrate so generous that even CRF 14 saves little,
# so there is less to gain from going lower than the number suggests.
#CRF="18"

# (Optional) x264 preset. These clips are small and converted once, so the slower
# presets cost minutes and buy real bitrate.
#PRESET="slow"

# (Optional) AAC bitrate for stereo audio. Mono tracks take half, which is still
# generous for the 8 kHz recordings an early phone made.
#AUDIO_BITRATE="192k"

# (Optional) Video encoder. libx264 is the default because H.264 is what every
# player and every photo service accepts; libx265 produces smaller files that
# fewer things will open.
#VIDEO_CODEC="libx264"

# (Optional) Colour range of the result, "limited" or "full".
#
# A compact camera records full-range levels. Converting them to the limited range
# that broadcast video uses costs a rounding-level remap and cannot be misread by
# anything. Keeping them full is bit-exact but relies on every player honouring the
# range flag, and one that ignores it shows washed-out, crushed contrast — which is
# the more visible failure of the two, so limited is the default.
#COLOR_RANGE="limited"

# (Optional) Earliest year a capture date may claim. A date before this is treated
# as absent rather than trusted: an MP4 header that was never filled in reads back
# as 1970, and a clip stamped 1970 sorts to the very start of a photo timeline.
#MIN_YEAR="1990"

# (Optional) Extensions to consider, space separated and matched case-insensitively.
# Files already holding modern streams are reported and left alone, so listing mp4
# here costs nothing and means a folder is reported in full rather than in part.
#
# Matroska and DVD VOB are absent: no camera wrote either, and only the video and
# audio are carried over, so a run over a film library would rewrap its files and
# leave their subtitles behind.
#EXTENSIONS="avi mpg mpeg mov qt mp4 m4v 3gp 3g2 wmv asf mts m2ts dv"

# (Optional) Path to the log file. If commented out or empty, output goes only to
# the console.
# Example: LOG_FILE="/var/log/modernize-video.log"
#LOG_FILE=""
