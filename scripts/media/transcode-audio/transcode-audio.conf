#
# Configuration file for the transcode-audio script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# Every setting has a default, so the script runs without this file.

# (Optional) Target audio codec, as ffmpeg names its encoder. AC-3 is the usual
# answer: it is what a receiver fed over S/PDIF understands, and what a streaming
# rip's Dolby Digital Plus track is not.
#AUDIO_FORMAT="ac3"

# (Optional) Bitrates, chosen per track from its channel count — one figure cannot
# suit both a 5.1 feature track and a stereo commentary. 640k is the AC-3 maximum
# and the right choice for 5.1; 256k is generous for two channels.
#SURROUND_BITRATE="640k"
#STEREO_BITRATE="256k"

# (Optional) Path to the log file. If commented out or empty, output goes only to
# the console.
# Example: LOG_FILE="/var/log/transcode-audio.log"
#LOG_FILE=""
