#
# Configuration file for the link-series script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# It names the download folder episodes are linked from, and optionally which
# extensions count as media and which kind of link to make.

# The folder searched for releases. Sonarr's completed-download folder is the
# usual choice; anything the *arr apps did not import themselves can be pulled
# from wherever it landed by passing --temp-dir instead.
#
# Searched recursively, so a season pack still inside its release folder is
# found: matching considers each file's path below this directory, not just its
# name.
TEMP_DIR="/mnt/storage/temp/sonarr"

# (Optional) Extensions treated as episodes, as a Bash array. Comment out to
# keep the built-in list (mkv mp4 avi m4v ts m2ts). Matched case-insensitively.
#MEDIA_EXTS=(mkv mp4 avi)

# (Optional) The kind of link to create: "hard" or "symlink". Hard links cost no
# extra space but cannot cross filesystems, so set this to "symlink" when the
# download folder and the library sit on different ones — otherwise every link
# fails and the reason is the same every time. --symlink overrides this per run.
#LINK_TYPE="hard"

# (Optional) Path to the log file. If commented out or empty, output goes only
# to the console.
# Example: LOG_FILE="/var/log/link-series.log"
#LOG_FILE=""
