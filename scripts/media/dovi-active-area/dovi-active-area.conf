#
# Configuration file for the dovi-active-area script.
#
# WARNING: This file is sourced as Bash code. Do not include untrusted content.
#
# Every setting has a default, so the script runs without this file. What is here
# is the sampling the report does, where a rewrite does its work, and where
# dovi_tool lives on a system that has no package for it.

# (Optional) Seconds of video sampled when reading a file's metadata. The sample
# only has to reach the frame read below; a longer one costs time per file and
# tells you nothing more.
#SAMPLE_SECONDS=10

# (Optional) Frame within that sample whose L5 block is read. A file whose active
# area changes between shots is reported from this frame alone, so if a title
# looks wrong in one scene and right in another, read a different frame.
#PROBE_FRAME=100

# (Optional) Where a rewrite does its work. Left unset, each file is rewritten in
# a hidden temporary directory beside itself, which keeps the intermediates on the
# same filesystem as the file: there is room for them there, and the finished
# remux replaces the original with a rename rather than a copy. Set this only to
# move that work elsewhere — to a fast scratch disk, say — and remember it needs
# room for the video track twice over.
#WORK_DIR=""

# (Optional) Path to dovi_tool, when it is not on PATH under that name. Debian has
# no package for it, so a release binary in an unusual place is the normal case.
# Example: DOVI_TOOL_BIN="/opt/dovi_tool/dovi_tool"
#DOVI_TOOL_BIN="dovi_tool"

# (Optional) Path to the log file. If commented out or empty, output goes only to
# the console.
# Example: LOG_FILE="/var/log/dovi-active-area.log"
#LOG_FILE=""
