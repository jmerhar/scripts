# Publishes script releases as Homebrew formulas and Debian packages.
#
# Triggers:
# 1. Release published with a "script-name-vX.Y.Z" tag → packages that script.
# 2. Manual workflow_dispatch → republishes the latest version of all scripts.
name: Publish Script

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main scripts repo
        uses: actions/checkout@v7
        with:
          path: scripts
          fetch-depth: 0

      - name: Checkout Homebrew tap repo
        uses: actions/checkout@v7
        with:
          repository: jmerhar/homebrew-scripts
          path: homebrew-scripts
          token: ${{ secrets.PAT }}

      - name: Checkout APT repo
        uses: actions/checkout@v7
        with:
          repository: jmerhar/apt-scripts
          path: apt-scripts
          token: ${{ secrets.PAT }}

      - name: Setup Git for multi-repo push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Package scripts and upload the release asset
        id: package
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/package/release-package.sh "${{ github.event_name }}" "${{ github.event.release.tag_name }}"

      # Both pushes run the same fetch-reset-regenerate-push cycle, which lives in
      # bin/package/publish-downstream.sh: 49 lines of retry logic that could otherwise only be
      # exercised by cutting a release. It is covered by test/bin/publish-downstream.bats.
      - name: Commit and push Homebrew changes
        if: success() && (steps.package.outputs.commit_message != '')
        run: |
          ./scripts/bin/package/publish-downstream.sh homebrew homebrew-scripts \
            "${{ steps.package.outputs.commit_message }}"

      - name: Sign and commit APT repository changes
        if: success() && (steps.package.outputs.commit_message != '')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./scripts/bin/package/publish-downstream.sh apt apt-scripts \
            "${{ steps.package.outputs.commit_message }}"
