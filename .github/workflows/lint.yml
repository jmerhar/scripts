name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck on all shell scripts
        run: |
          find . -name '*.sh' -not -path './dist/*' -print0 \
            | xargs -0 shellcheck --severity=warning

  validate-manifest:
    name: Validate scripts.yaml manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Registered scripts exist, are executable and have a shebang; the library is not executable;
      # unregistered scripts are reported. A script rather than inline shell so the same checks run
      # from `make lint` before a push, and are covered by test/bin/check-manifest.bats.
      - name: Validate the manifest against the tree
        run: ./bin/check-manifest.sh

      # min_bash drives the guard compiled into published scripts and the dependency metadata for
      # both channels. Declared by hand it would drift, so the requirement is re-derived from the
      # source here and the build fails if a script has outgrown what it declares.
      - name: Check declared bash versions cover the features used
        run: ./bin/check-bash-version.sh

      # The awk and jq programs the scripts run are not bash, so ShellCheck says nothing about them.
      # Unchecked, a typo in one surfaces only when the script runs it — for the pruning filters, that
      # means on the server, mid-run.
      - name: Syntax-check the awk and jq programs
        run: ./bin/check-programs.sh

      # The README index tables are generated from the manifest, so a hand-edit or a manifest change
      # without a `make docs` leaves them stale. Regenerating into a temp file and diffing turns that
      # into a build failure rather than something a reader notices later.
      - name: Check the README index tables match the manifest
        run: ./bin/update-all-tables.sh --check

  smoke-test:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Both steps are scripts rather than inline shell so they run from `make lint` before a push and
      # are covered by test/bin/compile-all-includes.bats and test/bin/smoke-package-all.bats.
      - name: Verify the published scripts are self-contained
        run: ./bin/check-published-form.sh

      # No separate compile step: the packager compiles each script it packages into dist/compiled, so the
      # artefacts cannot be built from the development form.
      - name: Run package-script against each manifest entry
        run: ./bin/smoke-package-all.sh

      - name: Verify output artifacts exist
        run: |
          test -d dist/homebrew && ls dist/homebrew/*.rb
          test -d dist/tarballs && ls dist/tarballs/*.tar.gz
          test -d dist/debian && ls dist/debian/*.deb
