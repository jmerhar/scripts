name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck on all shell scripts
        run: |
          find . -name '*.sh' -not -path './dist/*' -print0 \
            | xargs -0 shellcheck --severity=warning

  validate-manifest:
    name: Validate scripts.yaml manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Registered scripts exist, are executable and have a shebang; the library is not executable;
      # unregistered scripts are reported. A script rather than inline shell so the same checks run
      # from `make lint` before a push, and are covered by test/check-manifest.bats.
      - name: Validate the manifest against the tree
        run: ./bin/check-manifest.sh

      # min_bash drives the guard compiled into published scripts and the dependency metadata for
      # both channels. Declared by hand it would drift, so the requirement is re-derived from the
      # source here and the build fails if a script has outgrown what it declares.
      - name: Check declared bash versions cover the features used
        run: ./bin/check-bash-version.sh

  smoke-test:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Both steps are scripts rather than inline shell so they run from `make lint` before a push and
      # are covered by test/compile-all-includes.bats and test/smoke-package-all.bats.
      - name: Compile @include directives
        run: ./bin/compile-all-includes.sh

      - name: Run package-script against each manifest entry
        run: ./bin/smoke-package-all.sh

      - name: Verify output artifacts exist
        run: |
          test -d dist/homebrew && ls dist/homebrew/*.rb
          test -d dist/tarballs && ls dist/tarballs/*.tar.gz
          test -d dist/debian && ls dist/debian/*.deb
