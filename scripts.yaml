defaults:
  author: "Jure Merhar <dev@merhar.si>"
  homepage: "https://github.com/jmerhar/scripts"
  license: "MIT"

scripts:
  local-backup:
    path: scripts/system/local-backup/local-backup.sh
    description: "A generic script to create and automatically prune rsync-based system backups."
    min_bash: "4.0"        # mapfile
    dependencies:
      common: [rsync]

  prune-orphaned-torrents:
    path: scripts/system/prune-orphaned-torrents/prune-orphaned-torrents.sh
    description: "Finds orphaned media files left by *arr hard-linking and interactively removes the corresponding torrents from Deluge."
    min_bash: "4.0"        # ${var,,}, mapfile
    dependencies:
      common: [curl, jq]

  nopasswd-sudo:
    path: scripts/system/nopasswd-sudo/nopasswd-sudo.sh
    description: "Toggles temporary passwordless sudo for a user, with an in-session auto-revoke timer and a boot-time safety net so it never stays enabled by accident."
    platforms: [debian]   # systemd/sudoers tool — not applicable to Homebrew/macOS
    dependencies:
      debian: [sudo]

  mdcheck-progress:
    path: scripts/system/mdcheck-progress/mdcheck-progress.sh
    description: "Reports the progress of an MD RAID check (Debian's monthly mdcheck scrub), including while it is paused between nightly windows, with a schedule-aware estimate of when it will finish."
    min_bash: "4.0"        # mapfile
    platforms: [debian]   # reads MD sysfs + mdadm's mdcheck systemd units — Linux-only
    dependencies:
      debian: [mdadm]

  ufw-docker-expose:
    path: scripts/system/ufw-docker-expose/ufw-docker-expose.sh
    description: "Opens external access to Docker-published container ports using ufw route rules keyed on the port rather than the container's address, so a redeploy that renumbers the container cannot silently close the port from outside, and constrained to container address ranges so the rules do not swallow traffic the host routes for a VPN exit node or subnet router."
    platforms: [debian]   # ufw and its route rules are Linux-only
    dependencies:
      debian: [ufw]       # docker stays out: the publish check degrades without it, and naming a Docker package would fight a docker-ce install

  memory-pressure-alert:
    path: scripts/system/memory-pressure-alert/memory-pressure-alert.sh
    description: "Warns while a Mac is filling up — swap growing and memory use climbing — rather than once it has already stalled, and names the heaviest applications by resident plus compressed memory."
    platforms: [homebrew]  # reads macOS vm.swapusage/hw.memsize/vm_stat + notifies via osascript
    dependencies:
      common: []

  photo-backup:
    path: scripts/photography/photo-backup/photo-backup.sh
    description: "A robust script for backing up photo collections from multiple sources to a remote server using rsync."
    dependencies:
      common: [rsync]

  remove-sidecars:
    path: scripts/photography/remove-sidecars/remove-sidecars.sh
    description: 'A script to find and delete "sidecar" files when a corresponding RAW photo file exists.'
    min_bash: "4.0"        # ${var,,}, declare -A

  compare-dirs:
    path: scripts/utility/compare-dirs/compare-dirs.sh
    description: "Recursively compares two directories and reports differences in existence, size, timestamps, and checksums."
    min_bash: "4.0"        # ${var,,}, declare -A

  dmarc-report:
    path: scripts/utility/dmarc-report/dmarc-report.sh
    description: "Aggregates a folder of DMARC RUA reports (.xml.gz/.zip) into one overall report, tracking policy changes over time and flagging unenforced domains, unaligned senders, DNS/DKIM errors, and spoofing (grouped into subnets with per-range country lookup)."
    min_bash: "4.0"        # declare -A
    dependencies:
      common: [curl, jq]            # curl+jq: best-effort country lookup for failing ranges
      homebrew: [libxml2]           # provides xmllint (unzip/gzip ship with macOS)
      debian: [libxml2-utils, unzip]

  dovi-active-area:
    path: scripts/media/dovi-active-area/dovi-active-area.sh
    description: "Reports the Dolby Vision L5 active area of Matroska files, and on request zeroes it by rewriting the RPU in place, so a display stops cropping or letterboxing a picture that already fills its frame. Requires the external tool 'dovi_tool', which Debian has no package for."
    min_bash: "4.0"       # ${var,,}
    dependencies:
      common: [ffmpeg, jq, mediainfo, mkvtoolnix]
      homebrew: [dovi_tool]     # Debian has no dovi_tool package; the README says where to get a binary

  link-series:
    path: scripts/media/link-series/link-series.sh
    description: "Links episodes from a download folder into a series' library folder, taking the show and season from the destination directory itself, so manually acquired releases join the library without a second copy of the file."
    min_bash: "4.0"        # ${var,,}
    dependencies:
      common: []

  normalize-release-names:
    path: scripts/media/normalize-release-names/normalize-release-names.sh
    description: "Brings episode filenames to one spelling — dots for separators, lower case, and the season and episode as S01E02 — so that sidecar pairing, library linking and episode parsers all match the same names. Renames subtitles alongside their video and refuses a rename whose destination is taken."
    min_bash: "4.0"       # ${var,,}
    dependencies:
      common: []

  subtitle-report:
    path: scripts/media/subtitle-report/subtitle-report.sh
    description: "Reports on subtitle coverage for a media library, detecting embedded tracks and sidecar files and breaking down counts by language and source."
    min_bash: "4.0"        # ${var,,}, declare -A
    dependencies:
      common: [ffmpeg]

  subtitle-sync:
    path: scripts/media/subtitle-sync/subtitle-sync.sh
    description: "Resynchronizes drifting subtitles to a video's speech using a Whisper transcript as reference and alass for segment-aware alignment (handles ad-break, global-offset, and speed drift). Requires the external tools 'alass' and 'whisper-ctranslate2' on PATH."
    min_bash: "4.3"        # local -n
    dependencies:
      common: [ffmpeg]

  transcode-audio:
    path: scripts/media/transcode-audio/transcode-audio.sh
    description: "Re-encodes the audio of Matroska files to a codec the playback chain can decode (AC-3 by default, for a receiver that cannot take Dolby Digital Plus), in one ffmpeg pass that copies the video, subtitles and chapters and keeps every audio track with its language and flags."
    min_bash: "4.0"       # ${var^^}
    dependencies:
      common: [ffmpeg, jq]

  unlock-pdf:
    path: scripts/utility/unlock-pdf/unlock-pdf.sh
    description: "Decrypts a password-protected PDF file using the 'qpdf' command-line tool."
    dependencies:
      common: [qpdf]
